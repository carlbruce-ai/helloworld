<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hello World</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        padding: 2rem;
        max-width: 480px;
        margin: 0 auto;
      }
      form {
        margin-top: 2rem;
        display: grid;
        gap: 1rem;
      }
      label {
        display: flex;
        flex-direction: column;
        font-weight: 600;
      }
      input[type="text"] {
        margin-top: 0.25rem;
        padding: 0.5rem;
        font-size: 1rem;
      }
      button {
        padding: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>It works 🎉</h1>
    <p>This page is served by GitHub Pages.</p>
    <p><strong>Tip:</strong> If you previously opened this site, force refresh with <kbd>Ctrl</kbd> + <kbd>F5</kbd> (or <kbd>Cmd</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> on macOS) to clear the cached form.</p>

    <h2>Vehicle information</h2>
    <p>Please provide the vehicle make, model, and color so we can prepare your quote.</p>

    <!-- Simple 3-field form -->
    <form>
      <label>Name: <input type="text" required></label><br>
      <label>Email: <input type="email" required></label><br>
      <label>Message: <textarea required></textarea></label><br>
      <button type="submit">Submit</button>
      <label for="vehicle-make">Make
        <input id="vehicle-make" name="make" type="text" required placeholder="e.g. Toyota" />
      </label>
      <label for="vehicle-model">Model
        <input id="vehicle-model" name="model" type="text" required placeholder="e.g. Corolla" />
      </label>
      <label for="vehicle-color">Color
        <input id="vehicle-color" name="color" type="text" required placeholder="e.g. Blue" />
      </label>
      <button type="submit">Save vehicle details</button>
    </form>
  </body>
</html>
